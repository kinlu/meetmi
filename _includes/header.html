{%- assign home_url = c.home | relative_url -%}
{%- if lang == 'zh' -%}{%- assign other_url = en_url -%}{%- else -%}{%- assign other_url = zh_url -%}{%- endif -%}
<header class="site-header">
  <div class="wrap site-header-row">
    <a class="brand" href="{{ home_url }}">
      <img src="{{ '/assets/img/icon-256.png' | relative_url }}" alt="" width="28" height="28">
      <span>MeetMi</span>
    </a>
    <nav class="site-nav" aria-label="{{ site.title }}">
      {%- for item in c.nav %}
      <a href="{{ home_url }}{{ item.href }}">{{ item.label }}</a>
      {%- endfor %}
    </nav>
    <div class="site-header-end">
      <a class="language" href="{{ other_url | relative_url }}" lang="{% if lang == 'zh' %}en{% else %}zh-Hans{% endif %}">{{ c.other_language }}</a>
      <a class="button button-small" href="{{ site.app_store_url | escape }}">{{ c.download }}</a>
    </div>
  </div>
</header>
