# Landing-page copy, one block per language. _layouts/home.html is the only
# reader. Strings may contain inline HTML (<mark>, <code>); nothing here is
# user input.
#
# Product facts on this page mirror the App Store listing and the privacy
# policy. Numbers that also appear in the app's subscription disclosure
# (1,000 / 4,500 credits, one-week trial) must change there first.
#
# `stage` is adapted from a real session (the one in the Mac App Store
# screenshots): the transcript lines are verbatim, with the harsher ones left
# out, and the last card is reworded to match. The caption says "adapted";
# keep it true. `at` is the beat on which a line or card arrives.

en:
  meta_title: "MeetMi: help during the meeting, not after it"
  meta_description: "MeetMi listens to your meeting and helps while it is still happening. On-device transcription, live advice, background analysis and meeting notes, for Mac. iPhone coming soon."
  hero:
    title: "Help during the meeting, not after it."
    lede: "MeetMi listens along, transcribes on your device, and tells you what to ask next, what was left unanswered, and what contradicts something said earlier, while people are still talking."
    cta: "Download for Mac"
    secondary: "See what it does"
    note: "One-week free trial. Requires macOS 26 and a Mac with Apple silicon. iPhone version coming soon."
  stage:
    status: "Meeting in progress"
    route: "Hearing English, advising in English"
    transcript_label: "Live transcript"
    advice_label: "MeetMi"
    tag: "MeetMi"
    caption: "Real output, from the same session as the screenshots below: a recorded commencement speech playing on a Mac."
    lines:
      - { at: 0, time: "18:43:23", text: "Reed College at that time offered perhaps the best calligraphy instruction in the country." }
      - { at: 1, time: "18:43:30", text: "Every poster, every label on every drawer was beautifully hand calligraphed." }
      - { at: 3, time: "18:43:38", text: "I decided to take a calligraphy class to learn how to do this." }
      - { at: 4, time: "18:43:46", text: "I learned about seraph and sand seraph typefaces about varying the amount of space between different letter combinations, about what makes great typography great." }
      - { at: 6, time: "18:44:01", text: "None of this had even a hope of any practical application in my life." }
      - { at: 7, time: "18:44:09", text: "But 10 years later, when we were designing the first Macintosh computer, it all came back to me." }
      - { at: 9, time: "18:44:13", text: "It was the first computer with beautiful typography." }
    cards:
      - at: 2
        time: "18:43:23"
        points:
          - { tag: "[Fact] ", text: "He's now introducing the calligraphy example — Reed College offered perhaps the <mark>best calligraphy instruction in the country</mark> at that time." }
      - at: 5
        time: "18:43:55"
        points:
          - { tag: "[Fact] ", text: "He likely means <mark>serif and sans-serif</mark> typefaces — \"seraph\" is a transcription slip for serif." }
          - { tag: "[Fact] ", text: "He's describing typography basics: letter spacing (kerning/tracking) and what makes great typography, which he learned in the calligraphy class." }
      - at: 8
        time: "18:44:10"
        points:
          - { tag: "[Fact] ", text: "<mark>10 years later</mark> he says the calligraphy skills 'came back' when designing the first Macintosh — this is the payoff claim, but he hasn't yet explained how it was applied." }
          - { tag: "[Action] ", text: "Note the upcoming Macintosh connection: expect him to claim Mac's typography came from Reed's calligraphy class — a claim to check for accuracy." }
      - at: 10
        time: "18:44:26"
        points:
          - { tag: "[Advice] ", text: "Verify the claim that the Mac was the first with beautiful typography — early computers like the Xerox Alto had proportional fonts, so the 'first' label needs checking." }
  features:
    title: "It follows the conversation so you can stay in it."
    live:
      title: "Short, specific suggestions"
      body: "A real-time advisor follows along and posts what matters every few sentences: facts worth checking, risks worth raising, the next thing to ask."
      alt: "The MeetMi window on a Mac. A live transcript fills the top half; below it, MeetMi's suggestions arrive as cards labelled Fact, Advice and Action."
    analysis:
      title: "An analysis that keeps rewriting itself"
      body: "In the background, MeetMi keeps a running picture of the people, the numbers, the commitments and the open questions, and revises it every few minutes. Fact checks and an adversarial review are part of it."
      alt: "The analysis panel: an overview, the people involved, key numbers and commitments with figures highlighted, cited sources, key points and a fact check."
    ask:
      title: "Ask anything, mid-meeting"
      body: "Type a question and get an answer grounded in what has actually been said. With your separate consent, MeetMi can also research the web and cite what it finds."
      alt: "A question typed during the meeting, answered with a conclusion, the numbers behind it, linked sources and next steps."
    ondevice:
      title: "Transcribed and translated on your Mac"
      body: "Live transcription and translation use Apple's on-device speech models. Raw audio is never saved and never uploaded."
    bothsides:
      title: "It hears the other side of the call"
      body: "MeetMi can transcribe the audio coming out of your Mac, so remote participants are captured whichever app the call is in. macOS asks for its screen-recording permission for that. You can decline and use the microphone alone."
  notes:
    title: "Notes written before you stand up."
    body: "When the meeting ends, MeetMi drafts the notes from the whole transcript, not from a summary of a summary: an overview, the discussion, decisions and action items."
    export: "Export the notes, the analysis and the transcript to Markdown, Word or Pages."
    alt: "A finished meeting note with an overview, discussion points, decisions and action items."
  material:
    title: "It reads your folder before it speaks."
    body: "Point MeetMi at a folder of briefs, specs, contracts or earlier notes, and its advice and meeting notes refer to your material instead of generalities. Notes are saved back to the same folder."
    agents: "An optional <code>AGENTS.md</code> file in the folder tells MeetMi how you want it to work."
    formats: "Reads Markdown, plain text, PDF, Word, Pages, HTML, RTF, CSV, JSON and YAML."
    folder_name: "Acme renewal"
    files:
      - { name: "AGENTS.md", hint: "how you want MeetMi to work" }
      - { name: "Renewal contract draft.docx" }
      - { name: "Pricing notes.md" }
      - { name: "Security questionnaire.pdf" }
      - { name: "Last call notes.pages" }
  privacy:
    title: "What stays on your device, and what doesn't."
    items:
      - title: "Audio never leaves your device"
        body: "Speech recognition and translation run on your device. Raw audio is never saved and never uploaded."
      - title: "Cloud AI is off until you agree"
        body: "Before any text is sent, the app shows which model and which providers it reaches. What goes is text: the transcript, your questions and relevant snippets from your folder, over a zero-retention route."
      - title: "No account"
        body: "There is nothing to sign up for. The App Store subscription is the only gate."
      - title: "Web search needs its own consent"
        body: "Research goes online only after its own consent, because search does not carry the same zero-retention guarantee. Real-time advice and meeting notes never search the web."
      - title: "Your files stay in your folder"
        body: "Transcripts, analysis and notes live on your device and in the folder you choose."
      - title: "Let the people you meet with know"
        body: "Rules on recording and transcription differ by place and workplace. The permission prompts on your own device are not consent from the other participants, so tell them when it applies."
    link: "Read the privacy policy"
  iphone:
    badge: "Coming soon"
    title: "MeetMi for iPhone"
    body: "For meetings in the room. Put the phone on the table, and it keeps transcribing with the screen locked. One subscription covers Mac and iPhone, with one shared credit balance."
    note: "On iPhone, MeetMi listens through the microphone only."
    shots:
      - { src: "iphone-advice.webp", alt: "MeetMi on iPhone showing suggestion cards during a lecture, with a key figure highlighted." }
      - { src: "iphone-analysis.webp", alt: "The analysis tab on iPhone: overview, people, key numbers and commitments." }
      - { src: "iphone-notes.webp", alt: "A finished meeting note on iPhone." }
  pricing:
    title: "One plan, billed through the App\u00A0Store."
    amount: "$9.99"
    per: "per month in the United States"
    region: "The App Store shows the price for your country or region before you subscribe."
    points:
      - "One-week free trial with 1,000 credits"
      - "4,500 credits every month after the trial"
      - "One subscription for Mac and, when it arrives, iPhone"
      - "Cancel any time in your Apple Account"
    credits: "Credits measure how much cloud AI you use, so a longer meeting uses more. Transcription and translation happen on your device and use none."
    lapse: "If the subscription lapses or the credits run out, transcription, translation, history and export keep working. Only new AI requests stop."
    cta: "Download for Mac"
  questions:
    title: "Questions"
    items:
      - q: "Does MeetMi record my meetings?"
        a: "No. Audio is turned into text on your device as it arrives, and the raw audio is never saved or uploaded. What MeetMi keeps is the transcript, the analysis and the notes, on your device and in your folder."
      - q: "Does it work with the meeting app I use?"
        a: "MeetMi does not plug into meeting apps and does not need to. On a Mac it transcribes whatever audio your Mac is playing, plus your microphone. No bot joins the call, and there is nothing to install in the meeting app."
      - q: "What is sent to the cloud?"
        a: "Only after you agree: transcript text, your questions and relevant snippets from your folder go through the MeetMi relay to the AI provider over a zero-retention route. Audio never goes. The app shows the model and the providers before anything is sent, and asks again if they change."
      - q: "Which languages does it work in?"
        a: "Transcription uses Apple's on-device speech models and can pick the spoken language automatically when a meeting starts. Separately, you choose the language MeetMi writes in: English, Simplified or Traditional Chinese, Japanese, Korean, German, French, Spanish, Portuguese or Italian. It can listen in one language and advise in another."
      - q: "What happens if I cancel?"
        a: "Transcription, translation, your meeting history and export keep working. Only new AI requests stop. You manage or cancel the subscription in your Apple Account, like any App Store subscription."
      - q: "What do I need to run it?"
        a: "macOS 26 or later on a Mac with Apple silicon (M1 or newer). The iPhone version is coming soon."
  closing:
    title: "Bring it to your next meeting."
    cta: "Download for Mac"
    note: "One-week free trial"

zh:
  meta_title: "MeetMi：边开会，边帮你"
  meta_description: "MeetMi 跟你一起听会，开会的时候就帮你：本机转写、实时提醒、后台分析、会后纪要。Mac 版已上架，iPhone 版即将上线。"
  hero:
    title: "边开会，边帮你。"
    lede: "MeetMi 跟你一起听会，在你自己的电脑上把话转成文字。大家还在说的时候，它就提醒你：接下来该问什么，哪个问题被绕过去了，哪句话跟前面说的对不上。"
    cta: "下载 Mac 版"
    secondary: "看看它能做什么"
    note: "免费试用一周。需要 macOS 26，M1 或更新的 Mac。iPhone 版即将上线。"
  stage:
    status: "会议进行中"
    route: "听英语，用中文给建议"
    transcript_label: "实时转写"
    advice_label: "MeetMi"
    tag: "MeetMi"
    caption: "真实输出，和下面几张截图出自同一场：Mac 上放的一段毕业典礼演讲。右边卡片原文是英文，这里翻成了中文。"
    lines:
      - { at: 0, time: "18:43:23", text: "Reed College at that time offered perhaps the best calligraphy instruction in the country." }
      - { at: 1, time: "18:43:30", text: "Every poster, every label on every drawer was beautifully hand calligraphed." }
      - { at: 3, time: "18:43:38", text: "I decided to take a calligraphy class to learn how to do this." }
      - { at: 4, time: "18:43:46", text: "I learned about seraph and sand seraph typefaces about varying the amount of space between different letter combinations, about what makes great typography great." }
      - { at: 6, time: "18:44:01", text: "None of this had even a hope of any practical application in my life." }
      - { at: 7, time: "18:44:09", text: "But 10 years later, when we were designing the first Macintosh computer, it all came back to me." }
      - { at: 9, time: "18:44:13", text: "It was the first computer with beautiful typography." }
    cards:
      - at: 2
        time: "18:43:23"
        points:
          - { tag: "【事实】", text: "他开始讲书法这个例子了——当年 Reed College 的<mark>书法课大概是全美最好的</mark>。" }
      - at: 5
        time: "18:43:55"
        points:
          - { tag: "【事实】", text: "他说的应该是<mark>衬线体和无衬线体</mark>，转写成 “seraph” 是听错了。" }
          - { tag: "【事实】", text: "他在讲字体排印的基本功：字距怎么调、什么样的排印才算好，这些都是那门书法课上学的。" }
      - at: 8
        time: "18:44:10"
        points:
          - { tag: "【事实】", text: "他说<mark>十年后</mark>做第一台 Macintosh 时，这些书法功底又回来了——这是他要收的那个果，但还没说具体怎么用上的。" }
          - { tag: "【行动项】", text: "留意接下来那个 Macintosh 的说法：他大概会说 Mac 的字体排印来自 Reed 的书法课，这个值得核一下。" }
      - at: 10
        time: "18:44:26"
        points:
          - { tag: "【建议】", text: "“Mac 是第一台有漂亮字体排印的电脑”这句可以查一下——更早的 Xerox Alto 就有等宽之外的比例字体，“第一”这个说法站不站得住得看证据。" }
  features:
    title: "它帮你盯着，你专心开会。"
    live:
      title: "提醒简短，说到点上"
      body: "它一直跟着会议走，每隔几句话就告诉你要紧的事：哪个说法得核实一下，哪个风险没人提，接下来该问什么。"
      alt: "Mac 上的 MeetMi 窗口，正在听一段讲座录像。上半部分是实时转写，下半部分是提醒卡片，标着事实、建议和行动项，右边是深度分析面板。"
    analysis:
      title: "分析一直在更新"
      body: "MeetMi 在后台帮你理清楚：谁是谁，提到了哪些数字，谁答应了什么，还有哪些问题没解决。每隔几分钟重新整理一遍，顺带核查事实、挑挑毛病。"
      alt: "分析面板：概览、相关的人、关键数字（数字有高亮）、引用来源、主题脉络、要点、事实核查和对抗式审视。"
    ask:
      title: "开着会，随时问它"
      body: "想到什么直接打字问，它会根据会上真正说过的话来回答。如果你单独同意了联网，它还能上网查，并标明出处。"
      alt: "会议中打字问的一个问题，回答里有结论、相关数字、带链接的来源和下一步建议。"
    ondevice:
      title: "转写和翻译，都在你自己的 Mac 上"
      body: "用的是 Apple 装在你电脑里的语音模型。声音不会存下来，也不会传出去。"
    bothsides:
      title: "对方说的话，它也听得到"
      body: "MeetMi 能把 Mac 里放出来的声音也转成文字，所以不管你用哪个软件开会，对方说的话都记得下来。这需要 macOS 的“屏幕录制”权限。不想给也行，只用麦克风照样能用。"
  notes:
    title: "会一开完，纪要就写好了。"
    body: "纪要是照着整场会的完整记录写的，不是拿几段摘要再拼一遍。里面有概览、讨论了什么、定了什么、谁要做什么。"
    export: "纪要、分析和转写都能导出成 Markdown、Word 或 Pages。"
    alt: "一份写好的会议纪要，标题取自会议内容，有概览、讨论要点、决定和待办事项。"
  material:
    title: "它会先看你的资料，再给建议。"
    body: "给它指定一个文件夹，把简报、需求文档、合同、以前的纪要放进去。这样它给的建议和写的纪要都对得上你的实际情况，不会说空话。写好的纪要也存回这个文件夹。"
    agents: "还可以在文件夹里放一个 <code>AGENTS.md</code>，写上你希望它怎么干活。不放也行。"
    formats: "能读 Markdown、纯文本、PDF、Word、Pages、HTML、RTF、CSV、JSON 和 YAML。"
    folder_name: "Acme 续约"
    files:
      - { name: "AGENTS.md", hint: "告诉它怎么干活" }
      - { name: "续约合同草稿.docx" }
      - { name: "报价笔记.md" }
      - { name: "安全问卷.pdf" }
      - { name: "上次通话纪要.pages" }
  privacy:
    title: "什么留在本机，什么会发出去。"
    items:
      - title: "声音不出设备"
        body: "语音识别和翻译都在你自己的设备上做。声音不会存下来，也不会传出去。"
      - title: "云端 AI 默认是关的"
        body: "你点了同意才会打开。发送之前，App 会先告诉你内容要发给哪个模型、哪几家供应商。发出去的只有文字：转写内容、你的提问，还有你文件夹里相关的几段话。走的是不留存数据的线路。"
      - title: "不用注册"
        body: "没有账号，也不用登录。在 App Store 订阅了就能用。"
      - title: "上网查资料，要你另外同意"
        body: "搜索服务没法保证不留存数据，所以这一项会单独问你。你不点头，它就不联网。实时提醒和会议纪要从来不上网搜。"
      - title: "文件还是你的"
        body: "转写、分析和纪要只存在你的设备上，和你自己选的那个文件夹里。"
      - title: "记得跟其他人打声招呼"
        body: "各地法律、各家公司对录音和转写的规定不一样。你在系统弹窗里点的“允许”，不代表其他参会的人也同意了。该说的时候，提前跟大家说一声。"
    link: "看看完整的隐私政策"
  iphone:
    badge: "即将上线"
    title: "iPhone 版 MeetMi"
    body: "当面开会的时候用。手机往桌上一放就行，锁了屏也会接着转写。订阅一次，Mac 和 iPhone 都能用，额度也是共用的。"
    note: "iPhone 上只用麦克风听。"
    shots:
      - { src: "iphone-advice.webp", alt: "iPhone 上的 MeetMi 在一场演讲中给出提醒卡片，关键数字有高亮。" }
      - { src: "iphone-analysis.webp", alt: "iPhone 上的分析页：概览、人物、关键数字和承诺。" }
      - { src: "iphone-notes.webp", alt: "iPhone 上一份写好的会议纪要。" }
  pricing:
    title: "就一个套餐，在\u00A0App\u00A0Store\u00A0订阅。"
    amount: "$9.99"
    per: "每月（美区价格）"
    region: "其他地区的价格以 App Store 显示的为准，订阅前就能看到。"
    points:
      - "先免费用一周，送 1,000 额度"
      - "之后每月 4,500 额度"
      - "订阅一次，Mac 能用，之后的 iPhone 版也能用"
      - "随时能在 Apple 账户里取消"
    credits: "额度就是云端 AI 的用量，会开得越长，用得越多。转写和翻译在本机做，不花额度。"
    lapse: "订阅到期了，或者额度用完了，转写、翻译、历史记录和导出都还能用，只是 AI 功能会先停下来。"
    cta: "下载 Mac 版"
  questions:
    title: "常见问题"
    items:
      - q: "MeetMi 会录音吗？"
        a: "不会。声音一进来，就在你的设备上直接转成文字，不存，也不上传。留下来的只有转写、分析和纪要，存在你的设备上，和你自己选的文件夹里。"
      - q: "我用的会议软件，它支持吗？"
        a: "它不用专门去“支持”哪个软件。在 Mac 上，它听的是电脑里放出来的声音，再加上你的麦克风，所以用什么软件开会都行。不会有机器人进你的会议，也不用在会议软件里装任何东西。"
      - q: "哪些东西会发到云端？"
        a: "只有你同意之后才会发，发的也只是文字：转写内容、你的提问，还有你文件夹里相关的几段话。这些经过 MeetMi 的中转服务发给 AI 供应商，走的是不留存数据的线路。声音从来不发。发送前 App 会告诉你用的是哪个模型、哪几家供应商。这些一变，它会重新问你。"
      - q: "支持哪些语言？"
        a: "转写用的是 Apple 的本机语音模型，开会时能自动听出大家说的是哪种语言。MeetMi 用什么语言写，你可以另外选：简体中文、繁体中文、英语、日语、韩语、德语、法语、西班牙语、葡萄牙语、意大利语。所以听英语、用中文给你建议，完全没问题。"
      - q: "取消订阅了会怎么样？"
        a: "转写、翻译、会议历史和导出都还能用，只是 AI 功能停了。订阅在你的 Apple 账户里管理和取消，跟别的 App Store 订阅一样。"
      - q: "需要什么样的电脑？"
        a: "macOS 26 或更新的系统，M1 或更新芯片的 Mac。iPhone 版即将上线。"
  closing:
    title: "下次开会，带上它。"
    cta: "下载 Mac 版"
    note: "免费试用一周"
